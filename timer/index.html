<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#262626">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">
  <title>Timer Allenamento</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="timer-view" class="view">
      <header class="topbar">
        <button id="btn-settings" class="icon-btn" aria-label="Impostazioni">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="btn-title" class="title" aria-label="Scegli modello">
          <span id="tpl-name">TABATA</span>
          <span id="total-time">00:00</span>
        </button>
        <button id="btn-aux" class="icon-btn" aria-label=""></button>
        <button id="btn-reset" class="reset-btn" aria-label="Azzera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4.5V9h-4.5"/></svg>
        </button>
      </header>

      <main id="phase-main" class="phase phase-main">
        <div id="phase-label" class="phase-label">PREPARA</div>
        <div id="phase-time" class="phase-time">00:00</div>
      </main>

      <div id="phase-next" class="phase phase-next">
        <button id="btn-media" class="media-thumb" aria-label="Esercizio" hidden></button>
        <div id="next-label" class="next-label"></div>
        <div id="next-time" class="next-time"></div>
      </div>

      <div class="controls">
        <button id="stat-left" class="stat">
          <span id="stat-left-num" class="stat-num"></span>
          <span id="stat-left-label" class="stat-label"></span>
        </button>
        <div class="center">
          <button id="btn-main" class="main-btn" aria-label="Avvia"></button>
          <div id="main-label" class="main-label">AVVIA</div>
        </div>
        <button id="stat-right" class="stat">
          <span id="stat-right-num" class="stat-num"></span>
          <span id="stat-right-label" class="stat-label"></span>
        </button>
      </div>
    </section>

    <section id="sessions-view" class="view sessions" hidden></section>

    <nav class="tabbar">
      <button class="tab" data-tab="round">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M10 2h4M12 2v3M19 6l1.5-1.5"/></svg>
        ROUND
      </button>
      <button class="tab" data-tab="tempo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/></svg>
        ENTRO IL TEMPO
      </button>
      <button class="tab" data-tab="cronometro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
        CRONOMETRO
      </button>
      <button class="tab" data-tab="sessioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        MODELLI
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div id="sheet-panel" class="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
