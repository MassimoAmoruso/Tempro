<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0E0F12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tempro">
  <title>Tempro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="timer-view" class="view timer">
      <header class="topbar">
        <button id="btn-settings" class="round-btn" aria-label="Impostazioni">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <button id="btn-title" class="title" aria-label="Cambia modello">
          <span id="tpl-name"></span>
          <span id="total-time"></span>
        </button>
        <button id="btn-reset" class="round-btn" aria-label="Azzera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4.5h4.5"/></svg>
        </button>
      </header>

      <div class="dial">
        <div class="pill"><span class="dot"></span><span id="phase-label"></span></div>
        <div class="ring">
          <svg viewBox="0 0 300 300" aria-hidden="true">
            <circle class="track" cx="150" cy="150" r="136"/>
            <circle id="ring-arc" class="arc" cx="150" cy="150" r="136" transform="rotate(-90 150 150)"/>
          </svg>
          <div class="ring-text">
            <div id="phase-time"></div>
            <div id="phase-sub"></div>
          </div>
        </div>
      </div>

      <div class="stats">
        <button id="stat-1" class="stat"><span id="stat-1-k" class="stat-k"></span><span class="stat-v"><span id="stat-1-v"></span><span id="stat-1-of" class="of"></span></span></button>
        <button id="stat-2" class="stat"><span id="stat-2-k" class="stat-k"></span><span class="stat-v"><span id="stat-2-v"></span><span id="stat-2-of" class="of"></span></span></button>
        <button id="stat-3" class="stat"><span id="stat-3-k" class="stat-k"></span><span class="stat-v"><span id="stat-3-v"></span><span id="stat-3-of" class="of"></span></span></button>
      </div>

      <button id="btn-media" class="exercise" hidden>
        <span id="media-thumb" class="ex-thumb"></span>
        <span class="ex-text">
          <span class="ex-title">Esercizio</span>
          <span id="media-sub" class="ex-sub"></span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="controls">
        <button id="btn-left" class="round-btn lg"></button>
        <button id="btn-main" class="main-btn"></button>
        <button id="btn-aux" class="round-btn lg"></button>
      </div>
    </section>

    <section id="sessions-view" class="view sessions" hidden></section>

    <nav class="tabbar">
      <button class="tab" data-tab="round">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M10 2h4"/></svg>
        Round
      </button>
      <button class="tab" data-tab="tempo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/></svg>
        Entro il tempo
      </button>
      <button class="tab" data-tab="cronometro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Cronometro
      </button>
      <button class="tab" data-tab="sessioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        Modelli
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div id="sheet-panel" class="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
